[project]
name = "cola-label-verifier"
version = "0.1.0"
description = "Prototype that checks alcohol beverage label artwork against its TTB COLA application data."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic-settings",
    "rapidfuzz",
    "pillow",
    "pypdfium2",
    "httpx2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
    "pre-commit",
]
security = [
    "pip-audit",
    "bandit",
    "cyclonedx-bom",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "ocr: needs the Tesseract binary (runs in Docker/CI)",
    "e2e: drives a real browser with Playwright",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "scripts"]

[[tool.mypy.overrides]]
# pypdfium2 ships no type information.
module = ["pypdfium2", "pypdfium2.*"]
ignore_missing_imports = true
