services:
  - type: web
    name: cola-label-verifier
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass # only ship commits that passed CI
    envVars:
      - key: EXTRACTOR_MODE
        value: dual
      # Render's proxy is the only route to the container, so trust its X-Forwarded-For.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # Kimi (Moonshot AI) reads the labels, chosen for cost (see README, Limitations). Any
      # OpenAI-compatible endpoint works here, such as Azure OpenAI in an agency tenant.
      - key: LLM_BASE_URL
        value: https://api.moonshot.ai/v1
      - key: LLM_MODEL
        value: kimi-k2.6
      # The key is entered in the Render dashboard, never committed.
      - key: LLM_API_KEY
        sync: false
