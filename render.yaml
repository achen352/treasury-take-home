services:
  - type: web
    name: cola-label-verifier
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass # only ship commits that passed CI
    envVars:
      - key: EXTRACTOR_MODE
        value: dual
      # Render's proxy is the only route to the container, so trust its X-Forwarded-For.
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      # OpenAI reads the labels (see README, Limitations). Any OpenAI-compatible endpoint
      # works here, such as Azure OpenAI in an agency tenant.
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-5.4-mini
      - key: LLM_REASONING_EFFORT
        value: low
      # The key is entered in the Render dashboard, never committed.
      - key: LLM_API_KEY
        sync: false
