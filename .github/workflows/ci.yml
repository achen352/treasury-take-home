name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install dependencies (hash-verified)
        run: python -m pip install --require-hashes -r requirements-dev.txt
      - name: Install Chromium (the browser and accessibility tests must run here, never skip)
        run: python -m playwright install --with-deps chromium
      - name: Install Tesseract (the OCR tests must run here, never skip)
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr tesseract-ocr-eng
          tesseract --version
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Tests
        # Failed test ids also become annotations, which are visible without opening the log.
        run: |
          set -o pipefail
          pytest --cov --cov-report=term-missing 2>&1 | tee pytest.log || {
            grep -E "^(FAILED|ERROR) " pytest.log | cut -c1-300 | sed 's/^/::error title=pytest::/'
            exit 1
          }

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t cola-label-verifier:ci .
      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id cola-label-verifier:ci -u)" != "0"
      - name: Image ships without pip
        # pip is not needed at runtime, and its vendored libraries are attack surface.
        run: |
          for py in /opt/venv/bin/python /usr/local/bin/python; do
            if docker run --rm --entrypoint "$py" cola-label-verifier:ci -c "import pip" 2>/dev/null; then
              echo "pip is importable via $py"
              exit 1
            fi
          done
      - name: Image reads a label with Tesseract
        run: |
          docker run -i --rm --entrypoint tesseract cola-label-verifier:ci stdin stdout --psm 3 \
            < tests/fixtures/synthetic/old-tom/label.png | tee ocr.txt
          grep -q "OLD TOM DISTILLERY" ocr.txt
      - name: Image ships the page and its sample labels
        run: |
          docker run --rm --entrypoint python cola-label-verifier:ci -c \
            "from app.web.samples import load_samples; assert len(load_samples()) >= 8"
      - name: Container serves /healthz without a Server header
        run: |
          docker run -d -p 8000:8000 --name app cola-label-verifier:ci
          for _ in $(seq 1 30); do
            if curl -fsS -D headers.txt -o /dev/null http://127.0.0.1:8000/healthz; then
              if grep -qi '^server:' headers.txt; then echo "Server header leaked"; exit 1; fi
              exit 0
            fi
            sleep 1
          done
          docker logs app
          exit 1
