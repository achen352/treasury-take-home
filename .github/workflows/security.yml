name: Security

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: new CVEs appear even when the code does not change

permissions:
  contents: read

jobs:
  dependencies:
    name: Dependency audit, SAST, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Install security tooling (hash-verified)
        run: python -m pip install --require-hashes -r requirements-security.txt
      - name: Audit runtime dependencies for known vulnerabilities
        run: pip-audit --strict --require-hashes --disable-pip -r requirements.txt
      - name: Static analysis (Bandit)
        run: bandit -r app -q
      - name: Generate SBOM (CycloneDX)
        run: cyclonedx-py requirements requirements.txt --output-format JSON --output-file sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the full history, not just the latest commit
          persist-credentials: false
      - name: Scan git history
        run: >
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose

  container:
    name: Container image scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t cola-label-verifier:scan .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cola-label-verifier:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
